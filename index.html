<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新股摇号抽签仪式主持稿生成器</title>
<meta name="description" content="填写发行信息与中签率，按数位自动拆解，生成完整的新股摇号抽签仪式主持稿">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='38' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-50:#eff5ff;
  --blue-100:#dbeafe;
  --ink:#16233b;
  --muted:#64748b;
  --line:#dbe4f0;
  --bg:#f4f7fc;
  --red:#dc2626;
  --green:#16a34a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:960px;margin:0 auto;padding:24px 16px 64px}

header.site{text-align:center;padding:26px 0 20px}
header.site h1{font-size:1.65rem;letter-spacing:.06em;color:var(--blue-dark)}
header.site p{color:var(--muted);font-size:.9rem;margin-top:6px}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 2px 10px rgba(30,64,175,.05);
}

/* 输入区 */
.input-card{padding:20px 22px;margin-bottom:22px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;margin-bottom:14px}
legend{font-weight:600;color:var(--blue-dark);padding:0 6px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.fld label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{
  width:100%;padding:9px 11px;font-size:.95rem;
  border:1.5px solid var(--line);border-radius:8px;outline:none;
  transition:border-color .15s;background:#fff;
}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  cursor:pointer;border:none;border-radius:8px;
  font-size:1rem;padding:11px 22px;
  background:var(--blue);color:#fff;
  transition:background .15s;
}
.btn:hover{background:var(--blue-dark)}
.btn.ghost{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue-100)}
.btn.ghost:hover{border-color:var(--blue);background:var(--blue-50)}
.error{margin-top:10px;color:var(--red);font-size:.9rem;min-height:1.2em}
.hint{margin-top:2px;color:var(--muted);font-size:.8rem}

/* 总览表 */
.overview{padding:20px 22px;margin-bottom:22px}
.overview h2{font-size:1.05rem;margin-bottom:12px;color:var(--blue-dark)}
.overview .note{margin-top:10px;color:var(--muted);font-size:.82rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;white-space:nowrap}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:center}
th{background:var(--blue-50);color:var(--blue-dark);font-weight:600}
tr.total td{background:#f8fbff;font-weight:600}
tr.hidden-step td{color:var(--muted);background:#fafbfd}
.ok{color:var(--green)}

/* 主持稿正文：逐字复刻模板（红=计算值，绿=提示语），保留原文空格；字体与 UI 统一 */
.script-doc{
  padding:34px 38px;
}
.script-doc p{
  font-size:1.06rem;line-height:1.9;
  white-space:pre-wrap;
  overflow-wrap:anywhere;      /* 长下划线/空格串在窄屏可折行，防横向溢出 */
  margin:0;
}
.script-doc p.blank{line-height:1.2}
.script-doc .v{color:#FF0000}
.script-doc .g{color:#228B22}

.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px}

@media (max-width:600px){
  .container{padding:16px 10px 48px}
  header.site{padding:16px 0 12px}
  header.site h1{font-size:1.22rem}
  header.site p{font-size:.82rem}
  .input-card{padding:14px}
  fieldset{padding:10px 12px 12px;margin-bottom:12px}
  .grid{grid-template-columns:1fr;gap:8px}
  .btn-row .btn{flex:1}
  .overview{padding:14px 12px;margin-bottom:14px}
  .overview h2{font-size:.95rem}
  table{font-size:.8rem}
  th,td{padding:6px 8px}
  .script-doc{padding:18px 14px}
  .script-doc p{font-size:.92rem;line-height:1.8}
  .actions{justify-content:stretch}
  .actions .btn{flex:1 1 100%}
}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .container{max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0 0 16px}
  .script-doc{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .overview h2{font-size:12pt}
  table{font-size:10pt}
  .script-doc p{font-size:12pt;line-height:1.85}
}
</style>
</head>
<body>
<div class="container">

<header class="site no-print">
  <h1>新股摇号抽签仪式主持稿生成器</h1>
  <p>填写发行信息与中签率，自动生成完整摇号抽签仪式主持稿</p>
</header>

<section class="card input-card no-print">
  <fieldset>
    <legend>公司与委托</legend>
    <div class="grid">
      <div class="fld"><label>发行公司全称</label><input id="fCompany" type="text"></div>
      <div class="fld"><label>委托（主承销商）全称</label><input id="fClient" type="text"></div>
    </div>
  </fieldset>
  <fieldset>
    <legend>嘉宾与公证</legend>
    <div class="grid">
      <div class="fld"><label>嘉宾1 职务</label><input id="fG1Title" type="text"></div>
      <div class="fld"><label>嘉宾1 姓名（环节1摇号嘉宾）</label><input id="fG1Name" type="text"></div>
      <div class="fld"><label>嘉宾1 称谓</label><select id="fG1Honor"><option>先生</option><option>女士</option></select></div>
      <div class="fld"><label>嘉宾2 职务（可空）</label><input id="fG2Title" type="text"></div>
      <div class="fld"><label>嘉宾2 姓名（留空＝仅一位嘉宾）</label><input id="fG2Name" type="text"></div>
      <div class="fld"><label>嘉宾2 称谓</label><select id="fG2Honor"><option>先生</option><option>女士</option></select></div>
      <div class="fld"><label>公证处名称</label><input id="fOffice" type="text"></div>
      <div class="fld"><label>公证员 1</label><input id="fNotary1" type="text"></div>
      <div class="fld"><label>公证员 2</label><input id="fNotary2" type="text"></div>
    </div>
  </fieldset>
  <fieldset>
    <legend>发行数据与中签率</legend>
    <div class="grid">
      <div class="fld"><label>网上定价发行量（股）</label><input id="fIssue" type="text" inputmode="numeric"></div>
      <div class="fld"><label>每 N 股确定一个申购号</label><input id="fShares" type="text" inputmode="numeric"></div>
      <div class="fld"><label>申购配号总数</label><input id="fTotal" type="text" inputmode="numeric"></div>
      <div class="fld"><label>号码中签数（留空自动＝发行量÷每号股数）</label><input id="fWinCount" type="text" inputmode="numeric" placeholder="留空自动计算"></div>
      <div class="fld"><label>配号区间上限（留空自动）</label><input id="fRange" type="text" placeholder="留空自动生成"></div>
      <div class="fld"><label>中签率（%，最小到万亿分之一）</label><input id="fRate" type="text" inputmode="decimal"></div>
    </div>
  </fieldset>
  <div class="btn-row">
    <button class="btn" id="genBtn" type="button">生成主持稿</button>
    <button class="btn ghost" id="resetBtn" type="button">恢复电科思仪示例</button>
  </div>
  <div class="error" id="errorBox" role="alert"></div>
  <div class="hint">深圳证券信息有限公司为固定承办单位；摇号结果一律留白（下划线）供现场填写；<span style="color:#FF0000">红色＝自动计算填入</span>，<span style="color:#228B22">绿色＝现场提示语（保留模板原样）</span>。</div>
</section>

<section id="outputArea" style="display:none">
  <div class="card overview">
    <h2>中签率拆解总览表</h2>
    <div class="table-wrap"><table id="overviewTable"></table></div>
    <div class="note" id="overviewNote"></div>
  </div>
  <div class="card script-doc" id="scriptDoc"></div>
  <div class="actions no-print">
    <button class="btn ghost" id="copyBtn" type="button">一键复制全文</button>
    <button class="btn ghost" id="wordBtn" type="button">导出 Word（.doc）</button>
    <button class="btn ghost" id="printBtn" type="button">打印 / 导出 PDF</button>
  </div>
</section>

<footer class="no-print">新股摇号抽签仪式主持稿生成器 · 单文件网页应用</footer>
</div>

<script>
'use strict';

/* ============ 基础常量与纯逻辑（不含 DOM，可独立测试） ============ */

var CN_DIGITS = ['零','一','二','三','四','五','六','七','八','九'];
var DENOM_NAMES = {3:'千', 4:'万', 5:'十万', 6:'百万', 7:'千万', 8:'亿', 9:'十亿', 10:'百亿', 11:'千亿', 12:'万亿'};
var SPLIT_MAP = {3:[2,1], 6:[5,1], 7:[5,2], 9:[5,4]};

/* 阿拉伯数字转中文读法，支持到万亿级 */
function numToChinese(n){
  if(n === 0) return '零';
  var smallUnits = ['', '十', '百', '千'];
  var bigUnits = ['', '万', '亿', '万亿'];
  var sections = [];
  var x = n;
  while(x > 0){ sections.push(x % 10000); x = Math.floor(x / 10000); }
  var result = '';
  for(var i = sections.length - 1; i >= 0; i--){
    var sec = sections[i];
    if(sec === 0) continue;
    if(result !== '' && sec < 1000) result += '零';
    var s = String(sec), t = '';
    for(var j = 0; j < s.length; j++){
      var d = s.charCodeAt(j) - 48;
      var u = s.length - 1 - j;
      if(d === 0){
        if(t !== '' && t.slice(-1) !== '零') t += '零';
      }else{
        t += CN_DIGITS[d] + smallUnits[u];
      }
    }
    t = t.replace(/零+$/, '');
    result += t + bigUnits[i];
  }
  if(result.slice(0, 2) === '一十') result = result.slice(1);
  return result;
}

/* 间隔读法（模板用语）："二"后接 百/千/万/亿 时读"两"，如 12500→一万两千五百 */
function numToLiang(n){
  return numToChinese(n).replace(/(?<!十)二(?=[百千万亿])/g, '两');
}

/* 发行数据"朗读式"：按 亿/万 分节（节间两个空格），节内逐位"阿拉伯数字+千/百/拾"，
   个位裸数字；0→零（连续合并、尾部丢弃）；2 后接 百/千/万/亿 时写"两"。
   例：24496500→两千4百4拾9万  6千5百；270159586→两亿  7千零1拾5万  9千5百8拾6 */
function numToReadout(n){
  var s = String(n);
  if(!/^\d+$/.test(s)) return '';
  s = s.replace(/^0+/, '') || '0';
  if(s === '0') return '零';
  var secUnits = ['', '万', '亿', '万亿'];
  var posUnits = ['', '拾', '百', '千'];
  var sections = [];
  var x = s;
  while(x.length > 0){ sections.unshift(x.slice(-4)); x = x.slice(0, -4); }
  var parts = [];
  sections.forEach(function(sec, si){
    var secNum = Number(sec);
    if(secNum === 0) return;
    var t = '';
    var pendingZero = false;
    var sd = String(secNum);               /* 去掉节内前导零（跨节零由下方补） */
    for(var j = 0; j < sd.length; j++){
      var ch = sd[j];
      var pos = sd.length - 1 - j;
      if(ch === '0'){ pendingZero = true; continue; }
      if(pendingZero){ t += '零'; pendingZero = false; }
      if(pos === 0){ t += ch; }
      else{ t += (ch === '2' ? '两' : ch) + posUnits[pos]; }
    }
    var unit = secUnits[sections.length - 1 - si];
    if(t === '2' && (unit === '万' || unit === '亿' || unit === '万亿')) t = '两';
    if(parts.length > 0 && secNum < 1000) t = '零' + t;
    parts.push(t + unit);
  });
  return parts.join('  ');
}

/* 中签率逐位读法：0.0181348368 → 零点零壹 八壹三四 八三六八（前2位+每4位分节） */
function rateReadout(normStr){
  var dec = normStr.split('.')[1] || '';
  var map = ['零','壹','二','三','四','五','六','七','八','九'];
  var out = [];
  for(var i = 0; i < dec.length; i++) out.push(map[dec.charCodeAt(i) - 48]);
  var groups = [];
  var rest = out.join('');
  groups.push(rest.slice(0, 2));
  rest = rest.slice(2);
  while(rest.length > 0){ groups.push(rest.slice(0, 4)); rest = rest.slice(4); }
  return '零点' + groups.join(' ');
}

/* 解析中签率百分比输入（字符串方式解析，避免浮点误差） */
function parsePercent(raw){
  var s = String(raw == null ? '' : raw).trim();
  if(!s) return {ok:false, error:'请输入中签率数值'};
  if(/^-/.test(s)) return {ok:false, error:'中签率必须为正数，不能为负值'};
  if(!/^\d+(\.\d+)?$/.test(s)) return {ok:false, error:'中签率包含非法字符，请输入纯数字，例如 0.0181348368'};
  var parts = s.split('.');
  var intPart = parts[0];
  var decRaw = parts[1] || '';
  var decPart = decRaw.replace(/0+$/, '');
  if(decPart.length > 10) return {ok:false, error:'精度超出支持范围（最小到万亿分之一）'};
  var intVal = Number(intPart);
  if(intVal >= 100) return {ok:false, error:'中签率必须小于 100（%）'};
  if(intVal >= 1) return {ok:false, error:'当前仅支持小于 1% 的中签率（千分位至万亿分位）'};
  var padded = (decPart + '0000000000').slice(0, 10);
  var digits = padded.split('').map(function(c){ return c.charCodeAt(0) - 48; });
  if(digits.every(function(d){ return d === 0; })) return {ok:false, error:'中签率必须大于 0'};
  return {
    ok:true,
    digits:digits,                          /* digits[0]→千分位 … digits[9]→万亿分位 */
    normStr:'0.' + padded.replace(/0+$/, ''),
    scaled:Number(padded)                   /* 以 10^-10 % 为单位的整数值，用于合计校验 */
  };
}

/* 按数位拆解，生成环节计划 */
function buildPlan(digits){
  var steps = [];
  digits.forEach(function(d, i){
    if(d === 0) return;                     /* 数字为 0 的位直接跳过 */
    var N = i + 3;                          /* 千分位=3位 … 万亿分位=12位 */
    var base = Math.pow(10, N);
    var step = {
      N:N,
      digit:d,
      denom:DENOM_NAMES[N],
      percentStr:'0.' + '0'.repeat(i) + d   /* 该位贡献的中签率（%） */
    };
    var divisible = base % d === 0;         /* 拆分判断：10^N ÷ 分子 是否除得尽 */
    if(d === 1){
      step.type = 'A';
    }else if(divisible){
      step.type = 'B';
      step.interval = base / d;
    }else{
      step.type = 'C';
      var ab = SPLIT_MAP[d];
      step.parts = [
        {m:ab[0], interval:base / ab[0]},
        {m:ab[1], interval:ab[1] > 1 ? base / ab[1] : null}
      ];
    }
    steps.push(step);
  });
  return steps;
}

/* 合计校验：各环节贡献之和（10^-10 % 整数单位）应与输入一致 */
function scaledSum(steps){
  return steps.reduce(function(sum, st){
    return sum + st.digit * Math.pow(10, 12 - st.N);
  }, 0);
}

/* 摇号机分工：每轮至多 3 台机；连接词 首先由/下面由/再由… */
function drawPasses(N){
  var out = [];
  for(var s = 1; s <= N; s += 3){
    var digits = [];
    for(var d = s; d <= Math.min(s + 2, N); d++) digits.push(d);
    var machines = [];
    for(var m = 1; m <= digits.length; m++) machines.push(m);
    out.push({
      conn: s === 1 ? '首先由' : (s === 4 ? '下面由' : '再由'),
      machines:machines,
      digits:digits
    });
  }
  return out;
}

/* ============ 输入整理与派生（纯函数，可测试） ============ */

function prepareData(raw){
  function fail(msg){ return {ok:false, error:msg}; }
  var v = {};
  v.company = (raw.company || '').trim();
  v.client = (raw.client || '').trim();
  v.office = (raw.office || '').trim();
  v.notary1 = (raw.notary1 || '').trim();
  v.notary2 = (raw.notary2 || '').trim();
  if(!v.company) return fail('请填写发行公司全称');
  if(!v.client) return fail('请填写委托（主承销商）全称');
  if(!v.office) return fail('请填写公证处名称');
  if(!v.notary1 || !v.notary2) return fail('请填写两位公证人员姓名');

  var g1 = {title:(raw.g1title || '').trim(), name:(raw.g1name || '').trim(), honor:raw.g1honor || '先生'};
  var g2 = {title:(raw.g2title || '').trim(), name:(raw.g2name || '').trim(), honor:raw.g2honor || '先生'};
  if(!g1.name) return fail('请填写嘉宾1姓名');
  v.guests = g2.name ? [g1, g2] : [g1];

  if(!/^\d+$/.test((raw.issue || '').trim()) || Number(raw.issue) <= 0) return fail('网上定价发行量须为正整数');
  if(!/^\d+$/.test((raw.shares || '').trim()) || Number(raw.shares) <= 0) return fail('每号股数须为正整数');
  v.issue = (raw.issue || '').trim().replace(/^0+/, '') || '0';
  v.shares = (raw.shares || '').trim().replace(/^0+/, '') || '0';

  var totalStr = (raw.total || '').trim();
  if(!/^\d+$/.test(totalStr)) return fail('申购配号总数须为正整数');
  totalStr = totalStr.replace(/^0+/, '');
  if(!totalStr) return fail('申购配号总数须为正整数');
  v.total = totalStr;
  v.D = totalStr.length;
  if(v.D < 4 || v.D > 12) return fail('申购配号总数须为 4～12 位整数（当前 ' + v.D + ' 位）');
  v.firstDigit = totalStr.charAt(0);
  v.lastDigits = totalStr.slice(1);

  var wc = (raw.winCount || '').trim();
  if(wc){
    if(!/^\d+$/.test(wc) || Number(wc) <= 0) return fail('号码中签数须为正整数（或留空自动计算）');
    v.winCount = wc.replace(/^0+/, '');
    v.winAuto = false;
  }else{
    v.winCount = String(Math.round(Number(v.issue) / Number(v.shares)));
    v.winAuto = true;
  }
  if(Number(v.winCount) <= 0) return fail('号码中签数计算结果须大于 0，请检查发行量与每号股数');

  v.rangeLower = '0000，0000，0001';
  var rg = (raw.range || '').trim();
  if(rg){
    v.rangeUpper = rg;
  }else{
    var p12 = ('000000000000' + v.total).slice(-12);
    v.rangeUpper = p12.slice(0, 4) + ',' + p12.slice(4, 8) + ',' + p12.slice(8, 12);
  }

  var pr = parsePercent(raw.rate);
  if(!pr.ok) return fail(pr.error);
  v.rateParsed = pr;
  v.rateNorm = pr.normStr;
  v.maxN = Math.min(v.D - 1, 12);           /* 环节只生成到 配号位数-1 */
  v.stepsAll = buildPlan(pr.digits);
  v.shown = v.stepsAll.filter(function(st){ return st.N <= v.maxN; });
  v.hidden = v.stepsAll.filter(function(st){ return st.N > v.maxN; });
  return {ok:true, v:v};
}

/* 为各环节分配编号（拆分占两个号：——A/——B），返回 {labels: {step:'4——A/5——B'}, total: 最大编号} */
function numberSteps(shown){
  var labels = [];
  var k = 1;
  shown.forEach(function(st){
    if(st.type === 'C'){ labels.push(k + '——A / ' + (k + 1) + '——B'); k += 2; }
    else{ labels.push(String(k)); k += 1; }
  });
  return {labels:labels, total:k - 1};
}

/* ============ 文档构建（段落 = run 数组；run={t:文本, c:'r'红|'g'绿|无}） ============ */

function B(t){ return {t:t}; }
function R(t){ return {t:t, c:'r'}; }
function G(t){ return {t:t, c:'g'}; }

/* 逐位摇号过程段落（guest 非空时在首轮插入嘉宾摇号块） */
function passParas(N, guest){
  var out = [];
  var passes = drawPasses(N);
  passes.forEach(function(ps, i){
    var intro = ps.conn + ' ' + ps.machines.join('、') + '号机 ' +
      (ps.machines.length > 1 ? '分别摇出' : '摇出') +
      ' 此组号码的 倒数第' + ps.digits.join('、') + '位， ';
    if(i === 0){
      out.push([B(intro)]);
      if(guest){
        out.push([B('【有请' + guest.client + ' ' + guest.title + ' ' + guest.name + ' ' + guest.honor +
                    ' 来到1号 摇号机旁 进行摇号。'), G('（等待嘉宾就位）'), B(' 】')]);
      }
      out.push([B('请开始摇号'), G('（留意摇号情况）')]);
    }else{
      out.push([B(intro + '请开始摇号'), G('（留意摇号情况）')]);
    }
    out.push([B('号码已经产生，' + ps.digits.map(function(d){
      return '倒数第' + d + '位号码是___';
    }).join('，') + '。')]);
  });
  if(guest) out.push([B('【感谢' + guest.name + ' ' + guest.honor + ' ，请回位就坐】')]);
  return out;
}

/* 结果行（留白）：m=1 为单号型，m>1 为基本号+递增型 */
function resultPara(N, m, liang){
  if(m === 1){
    return [R(N + ' 位数 的中签号码已经产生，是____________'), B(' '), G('（根据显示屏读出）')];
  }
  return [R(N + ' 位数 的基本中签号码已经产生，是____________'), B(' '), G('（根据显示屏读出）'), B(' '),
    R('根据电脑程序计算显示，递增或递减  ' + liang + ' ，得到另外  ' + (m - 1) +
      ' 个中签号码是____________________________________________')];
}

function fanPara(N){
  return [R('凡申购号码 末  ' + N + ' 位数 与以上产生的号码相同 即中签。')];
}

/* 环节话术句 */
function openerParas(st, part){
  var dn = st.denom, N = st.N;
  if(part === 'A' || (part === undefined && st.type === 'A')){          /* 分子为1 */
    return [[B('下面我们摇出 '), R(dn + ' 分之  1'), B(' 的中签号码，'),
             R('摇出一个  ' + N + ' 位数 的中签号码。')]];
  }
  if(part === undefined && st.type === 'B'){                            /* 不拆分 */
    return [[B('下面我们摇出 '), R(dn + ' 分之  ' + st.digit), B(' 的中签号码，'),
             R('摇出一个  ' + N + ' 位数 作为基本中签号码，然后递增或递减  ' +
               numToLiang(st.interval) + ' ，得到另外  ' + (st.digit - 1) + ' 个中签号码。')]];
  }
  if(part === 'splitA'){                                                /* 拆分 A 段 */
    var a = st.parts[0], b = st.parts[1];
    return [
      [B('下面我们摇出 '), R(dn + ' 分之  ' + st.digit), B(' 的中签号码，将 '),
       R(dn + ' 分之  ' + st.digit), B(' 拆分成 '), R(dn + ' 分之  ' + a.m),
       B(' 和 '), R(dn + ' 分之  ' + b.m), B(' 。')],
      [B('首先我们摇出 '), R(dn + ' 分之  ' + a.m), B(' 的中签号码，'),
       R('摇出一个  ' + N + ' 位数 作为基本中签号码，然后递增或递减  ' +
         numToLiang(a.interval) + ' ，得到另外  ' + (a.m - 1) + ' 个中签号码。')]
    ];
  }
  /* 拆分 B 段（独立环节） */
  var pb = st.parts[1];
  var tail = pb.m === 1
    ? '摇出一个  ' + N + ' 位数 的中签号码。'
    : '摇出一个  ' + N + ' 位数 作为基本中签号码，然后递增或递减  ' +
      numToLiang(pb.interval) + ' ，得到另外  ' + (pb.m - 1) + ' 个中签号码。';
  return [[B('下面我们摇出 '), R(dn + ' 分之  ' + pb.m), B(' 的中签号码，'), R(tail)]];
}

/* 生成完整主持稿（段落数组，空数组 = 空行） */

  P([B('欢迎各位嘉宾的到来，并预祝' + v.company + ' '), R('新股发行'), B(' 获得圆满成功。')]);
  P([B('在摇号开始前，我们先请 主承销商代表 及 公证员 签署《公平承诺书》，承诺本次'), R('新股发行'),
     B(' 摇号抽签活动 客观、公平、公正，符合国家法律法规的有关规定，不存在任何虚假、舞弊行为。 首先有请  主承销商代表  签署《公平承诺书》，有请' +
       v.notary1 + ' 公证员 和 ' + v.notary2 + ' 公证人员 签署《公平承诺书》')]);
  BLANK();

  /* ---- 发行数据 ---- */
  var rateStr = v.rateNorm + ' %  （百分之  ' + rateReadout(v.rateNorm) + '）';
  P([B('本次' + v.company + ' ')]);
  P([R('向投资者 网上定价发行量为  ' + v.issue + ' （ ' + numToReadout(v.issue) + '）  股，')]);
  P([R('本次网上发行的申购配号总数为  ' + v.total + ' （ ' + numToReadout(v.total) + '）')]);
  P([B('配号区间为' + v.rangeLower + '――（至） '), R(v.rangeUpper), B(' 。')]);
  P([B('根据' + v.company + ' '), R('新股发行'), B(' 公告，')]);
  P([B('按每 '), R(v.shares + '股'), B(' 有效申购量  确定一个申购号，')]);
  P([B('将有 '), R(v.winCount + ' （ ' + numToReadout(v.winCount) + '）'), B(' 个号码中签，')]);
  P([B('中签率为 '), R(rateStr)]);
  BLANK();

  /* ---- 挑选摇号球 ---- */
  P([B('下面有请'), R('主承销商代表'), B(' 随机挑选三组不同的 摇号球。')]);
  P([B('选出的三组号码球分别是第_____组，第_____组，第_____组，')]);
  P([B('请工作人员依次将第_____组号码球倒入1号盒中，')]);
  P([B('              将第_____组号码球倒入2号盒中，')]);
  P([B('              将第_____组号码球倒入3号盒中，')]);
  P([B('有请公证员检查摇号球'), G('（留意检查情况）')]);
  P([B('请工作人员  将三组摇号球  分别放入摇号机中。'), G('（等待工作人员放置摇号球）')]);
  P([B('请公证员 进场检查 摇号器具。'), G('（公证员讲话）')]);
  P([B('谢谢公证员！')]);
  BLANK();

  /* ---- 摇号规则 ---- */
  P([B('下面宣读摇号规则：')]);
  P([B('1、（壹）摇号本着公开、公平、公正的原则，采用“随机和均衡相结合”的办法进行，即 根据中签率，首先随机摇出  某一位数的基本中签号码，然后递增或递减  一个相等数，得出其他中签号码。')]);
  P([B('2、（贰）每一个号码只能有一次中签机会，如果后轮摇出号码  与先前产生的中签号码相同，则后轮摇号无效，须重新摇号。')]);
  P([B('3、（叁）需要摇号 产生的每一组号码，均按照摇号机的编号顺序，先摇个位数，再摇十位数，再摇百位数，以此类推。')]);
  P([B('4、（肆）如果在摇号过程中  摇号器具  发生故障，则发生故障器具  摇出的当前号码无效，排除故障后，按摇号规则  继续摇出  新的中签号码。')]);
  BLANK();

  /* ---- 摇号开始 ---- */
  P([B('现在摇号开始，根据中签率 '), R(rateStr)]);
  BLANK();

  /* ---- 摇号环节 ---- */
  var numbering = numberSteps(v.shown);
  var K = 0;
  v.shown.forEach(function(st, idx){
    var isFirst = idx === 0;
    var guest = isFirst ? {client:v.client, title:v.guests[0].title, name:v.guests[0].name, honor:v.guests[0].honor} : null;
    if(st.type === 'C'){
      var a = st.parts[0], b = st.parts[1];
      P([G(K + 1 + ' 、 ' + st.denom + ' 分之 ' + st.digit + ' ——A')]);
      openerParas(st, 'splitA').forEach(function(p){ P(p); });
      passParas(st.N, guest).forEach(function(p){ P(p); });
      P(resultPara(st.N, a.m, a.interval ? numToLiang(a.interval) : ''));
      BLANK();
      P([G(K + 2 + ' 、 ' + st.denom + ' 分之 ' + st.digit + ' ——B')]);
      openerParas(st, 'splitB').forEach(function(p){ P(p); });
      passParas(st.N, null).forEach(function(p){ P(p); });
      P(resultPara(st.N, b.m, b.interval ? numToLiang(b.interval) : ''));
      BLANK();
      if(st.N !== v.maxN){ P(fanPara(st.N)); BLANK(); }   /* 与倒数第二步同 N 时不重复凡申购句 */
      K += 2;
    }else{
      P([G(K + 1 + ' 、 ' + st.denom + ' 分之 ' + st.digit)]);
      openerParas(st).forEach(function(p){ P(p); });
      passParas(st.N, guest).forEach(function(p){ P(p); });
      P(resultPara(st.N, st.digit, st.interval ? numToLiang(st.interval) : ''));
      BLANK();
      if(st.N !== v.maxN){ P(fanPara(st.N)); BLANK(); }   /* 与倒数第二步同 N 时不重复凡申购句 */
      K += 1;
    }
  });

  /* ---- 倒数第二步 ---- */
  var maxN = v.maxN;
  var dnMax = DENOM_NAMES[maxN];
  P([G(K + 1 + ' 、倒数第二步')]);
  P([G('留意剩余号码个数，如剩余号码个数小于或等于配号总数首位数字“ ' + v.firstDigit + ' ”，则进入： ' +
       (K + 2) + ' 、最后一步，（如剩余号码个数等于0，电脑屏幕会提示“摇号结束”，则直接结束语）。')]);
  P([G('如剩余号码个数大于配号总数首位数字“ ' + v.firstDigit + ' ”，则重复如下流程：')]);
  P([B('下面我们摇出 '), R(dnMax + ' 分之  1'), B(' 的中签号码，'),
     R('摇出一个  ' + maxN + ' 位数 的中签号码。')]);
  passParas(maxN, null).forEach(function(p){ P(p); });
  P(resultPara(maxN, 1, ''));
  BLANK();
  P(fanPara(maxN));
  BLANK();

  /* ---- 最后一步 ---- */
  var D = v.D;
  var balls = [];
  for(var bi = 0; bi <= Number(v.firstDigit); bi++) balls.push(String(bi));
  P([G(K + 2 + ' 、最后一步')]);
  P([R('经计算，现在还有 ____ 个 ' + D + ' 位数的中签号码未产生。')]);
  P([G('（重复下面的步骤，直到 剩余号码个数 为0）')]);
  P([G('次数：1、 2、 3、 4、 5、 6、 7、 8、 9')]);
  P([R('下面我们摇出  第_____个（最后一个）  ' + D + ' 位数的中签号码。')]);
  passParas(D - 1, null).forEach(function(p){ P(p); });
  P([R(D + ' 位数的后  ' + (D - 1) + ' 位号码已经产生，是____________'), B(' '), G('（根据显示屏读出）')]);
  BLANK();
  P([B('由于'), R('大于（小于）'), B(' 配号总数的后 '), R(String(D - 1)), B(' 位数 '), R(v.lastDigits)]);
  P([G('（A、只剩下一个可选号码：'), B(' '), R('系统自动分配 倒数第  ' + D + ' 位号码为 _____ '), B(' '), G('）')]);
  P([G('（B、有多个可选号码：'), B(' 请工作人员将1号机的全部号码球取出，将以下号码球放入摇号机中：')]);
  P([B('                                                               '), R(balls.join(' 、 ') + ' 、 ')]);
  P([B('请由1号机摇出倒数第 '), R(String(D)), B(' 位的号码   '), G('（留意摇号情况）')]);
  P([B('倒数第 '), R(String(D)), B(' 位号码已经产生，是_______________  '), G('）')]);
  BLANK();
  P([G('次数：1、 2、 3、 4、 5、 6、 7、 8、 9')]);
  P([R('第_____个（最后一个）  ' + D + ' 位数的中签号码已经产生，是______________________')]);
  P([G('（留意剩余号码个数，如果不为0，则重复上面的步骤，直到 最后一个  ' + D + ' 位数的中签号码产生）')]);
  BLANK();
  P(fanPara(D));
  BLANK();

  /* ---- 结束语 ---- */
  P([G(K + 3 + ' 、结束语')]);
  P([B('本次摇号的  中签号码  已全部产生。')]);
  P([B('下面有请公证员就本次摇号结果致公证词。'), G('（公证员上台致词）')]);
  P([B('谢谢公证员！')]);
  P([B('各位嘉宾，' + v.company + ' '), R('新股发行'), B(' 摇号抽签仪式 到此圆满结束，谢谢！')]);
  BLANK();
  BLANK();
  P([B('下面有请嘉宾上台拍照留念！')]);

  return doc;
}

/* ============ 渲染：纯文本 / 网页预览 / Word HTML ============ */

function docToText(doc){
  return doc.map(function(p){
    return p.map(function(r){ return r.t; }).join('');
  }).join('\n');
}

function escHtml(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function docToPreviewHtml(doc){
  return doc.map(function(p){
    if(p.length === 0) return '<p class="blank">&nbsp;</p>';
    var inner = p.map(function(r){
      var t = escHtml(r.t);
      if(r.c === 'r') return '<span class="v">' + t + '</span>';
      if(r.c === 'g') return '<span class="g">' + t + '</span>';
      return t;
    }).join('');
    return '<p>' + inner + '</p>';
  }).join('');
}

function docToWordHtml(doc){
  function runHtml(r){
    var t = escHtml(r.t).replace(/ /g, '&nbsp;');
    if(r.c === 'r') return '<span style="color:#FF0000">' + t + '</span>';
    if(r.c === 'g') return '<span style="color:#228B22">' + t + '</span>';
    return t;
  }
  var body = doc.map(function(p){
    if(p.length === 0) return '<p>&nbsp;</p>';
    return '<p>' + p.map(runHtml).join('') + '</p>';
  }).join('\n');
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" ' +
    'xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>' +
    '@page{size:A4;margin:2.5cm}p{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-size:14pt;line-height:1.75;margin:0 0 4pt}' +
    '</style></head><body>' + body + '</body></html>';
}

    if(!res.ok){
      errorBox.textContent = res.error;
      outputArea.style.display = 'none';
      return;
    }
    errorBox.textContent = '';
    var v = res.v;
    var doc = buildDocument(v);
    currentText = docToText(doc);
    currentWordHtml = docToWordHtml(doc);
    currentFileName = '摇号抽签仪式主持稿-' +
      v.company.replace(/\s*股份有限公司\s*$/, '').replace(/\s+/g, '') + '.doc';
    renderOverview(v);
    scriptDoc.innerHTML = docToPreviewHtml(doc);
    outputArea.style.display = '';
  }

  genBtn.addEventListener('click', generate);
  resetBtn.addEventListener('click', function(){
    fillForm(DEFAULTS);
    generate();
  });
  document.querySelector('.input-card').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.tagName === 'INPUT') generate();
  });

  copyBtn.addEventListener('click', function(){
    if(!currentText) return;
    function done(){
      copyBtn.textContent = '已复制 ✓';
      setTimeout(function(){ copyBtn.textContent = '一键复制全文'; }, 1500);
    }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = currentText;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(currentText).then(done, fallback);
    }else{
      fallback();
    }
  });

  wordBtn.addEventListener('click', function(){
    if(!currentWordHtml) return;
    var blob = new Blob(['﻿', currentWordHtml], {type:'application/msword'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = currentFileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  printBtn.addEventListener('click', function(){ window.print(); });
}
</script>
</body>
</html>
