<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新股摇号抽签仪式主持稿生成器</title>
<meta name="description" content="输入中签率，自动按数位拆解，生成新股摇号抽签仪式主持稿">
<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-50:#eff5ff;
  --blue-100:#dbeafe;
  --ink:#16233b;
  --muted:#64748b;
  --line:#dbe4f0;
  --bg:#f4f7fc;
  --red:#dc2626;
  --green:#16a34a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:880px;margin:0 auto;padding:24px 16px 64px}

header.site{text-align:center;padding:26px 0 20px}
header.site h1{font-size:1.65rem;letter-spacing:.06em;color:var(--blue-dark)}
header.site p{color:var(--muted);font-size:.9rem;margin-top:6px}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 2px 10px rgba(30,64,175,.05);
}

/* 输入区 */
.input-card{padding:22px;margin-bottom:22px}
.field-row{display:flex;gap:10px;flex-wrap:wrap}
.field-row label{width:100%;font-weight:600;font-size:.95rem}
#rateInput{
  flex:1;min-width:200px;
  padding:12px 14px;
  font-size:1.05rem;
  border:1.5px solid var(--line);
  border-radius:8px;
  outline:none;
  transition:border-color .15s;
}
#rateInput:focus{border-color:var(--blue)}
.btn{
  cursor:pointer;border:none;border-radius:8px;
  font-size:1rem;padding:12px 22px;
  background:var(--blue);color:#fff;
  transition:background .15s;
}
.btn:hover{background:var(--blue-dark)}
.btn.ghost{background:#fff;color:var(--blue-dark);border:1.5px solid var(--blue-100)}
.btn.ghost:hover{border-color:var(--blue);background:var(--blue-50)}
.examples{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.chip{
  cursor:pointer;border:1px solid var(--blue-100);
  background:var(--blue-50);color:var(--blue-dark);
  border-radius:999px;padding:4px 14px;font-size:.85rem;
  transition:background .15s;
}
.chip:hover{background:var(--blue-100)}
.error{margin-top:10px;color:var(--red);font-size:.9rem;min-height:1.2em}
.hint{margin-top:2px;color:var(--muted);font-size:.8rem}

/* 总览表 */
.overview{padding:20px 22px;margin-bottom:22px}
.overview h2{font-size:1.05rem;margin-bottom:12px;color:var(--blue-dark)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;white-space:nowrap}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:center}
th{background:var(--blue-50);color:var(--blue-dark);font-weight:600}
tr.total td{background:#f8fbff;font-weight:600}
.ok{color:var(--green)}

/* 主持稿正文 */
.script-doc{padding:34px 38px;font-family:"Songti SC","STSong","SimSun",serif}
.doc-head{text-align:center;margin-bottom:20px}
.doc-head h2{font-size:1.5rem;letter-spacing:.12em}
.doc-head .rate-line{color:var(--muted);margin-top:6px;font-size:1rem}
.segment{padding:8px 0}
.segment h3{font-size:1.12rem;color:var(--blue-dark);margin-bottom:10px}
.segment p{font-size:1.12rem;line-height:2.05;text-indent:2em;margin-bottom:6px}
.divider{border:none;border-top:1px solid var(--line);margin:18px 0}

.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px}

@media (max-width:600px){
  header.site h1{font-size:1.3rem}
  .script-doc{padding:24px 18px}
  .segment p{font-size:1.05rem;line-height:1.95}
  .actions{justify-content:stretch}
  .actions .btn{flex:1}
}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .container{max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0 0 16px}
  .script-doc{padding:0}
  .overview h2{font-size:12pt}
  table{font-size:10pt}
  .segment p{font-size:12pt;line-height:1.9}
}
</style>
</head>
<body>
<div class="container">

<header class="site no-print">
  <h1>新股摇号抽签仪式主持稿生成器</h1>
  <p>输入中签率，按数位自动拆解，一键生成摇号主持稿</p>
</header>

<section class="card input-card no-print">
  <div class="field-row">
    <label for="rateInput">中签率（%）</label>
    <input id="rateInput" type="text" inputmode="decimal" value="0.178925" placeholder="例如：0.178925" autocomplete="off" spellcheck="false">
    <button class="btn" id="genBtn" type="button">生成主持稿</button>
  </div>
  <div class="examples">
    快捷示例：
    <button class="chip" type="button" data-v="0.129">0.129%</button>
    <button class="chip" type="button" data-v="0.0456">0.0456%</button>
    <button class="chip" type="button" data-v="0.03">0.03%</button>
  </div>
  <div class="error" id="errorBox" role="alert"></div>
  <div class="hint">支持 0.000001% – 0.999999%（最小精确到亿分之一，即小数点后 6 位）；点击按钮或按回车生成。</div>
</section>

<section id="outputArea" style="display:none">
  <div class="card overview">
    <h2>拆解总览表</h2>
    <div class="table-wrap"><table id="overviewTable"></table></div>
  </div>
  <div class="card script-doc" id="scriptDoc"></div>
  <div class="actions no-print">
    <button class="btn ghost" id="copyBtn" type="button">一键复制全文</button>
    <button class="btn ghost" id="printBtn" type="button">打印 / 导出 PDF</button>
  </div>
</section>

<footer class="no-print">新股摇号抽签仪式主持稿生成器 · 单文件网页应用</footer>
</div>

<script>
'use strict';

/* ============ 基础常量与纯逻辑（不含 DOM，可独立测试） ============ */

var CN_DIGITS = ['零','一','二','三','四','五','六','七','八','九'];
var DENOM_NAMES = {3:'千', 4:'万', 5:'十万', 6:'百万', 7:'千万', 8:'亿'};
var SPLIT_MAP = {3:[2,1], 6:[5,1], 7:[5,2], 9:[5,4]};

/* 阿拉伯数字转中文读法，支持到亿级 */
function numToChinese(n){
  if(n === 0) return '零';
  var smallUnits = ['', '十', '百', '千'];
  var bigUnits = ['', '万', '亿'];
  var sections = [];
  var x = n;
  while(x > 0){ sections.push(x % 10000); x = Math.floor(x / 10000); }
  var result = '';
  for(var i = sections.length - 1; i >= 0; i--){
    var sec = sections[i];
    if(sec === 0) continue;
    if(result !== '' && sec < 1000) result += '零';
    var s = String(sec), t = '';
    for(var j = 0; j < s.length; j++){
      var d = s.charCodeAt(j) - 48;
      var u = s.length - 1 - j;
      if(d === 0){
        if(t !== '' && t.slice(-1) !== '零') t += '零';
      }else{
        t += CN_DIGITS[d] + smallUnits[u];
      }
    }
    t = t.replace(/零+$/, '');
    result += t + bigUnits[i];
  }
  if(result.slice(0, 2) === '一十') result = result.slice(1);
  return result;
}

/* 解析中签率百分比输入（字符串方式解析，避免浮点误差） */
function parsePercent(raw){
  var s = String(raw == null ? '' : raw).trim();
  if(!s) return {ok:false, error:'请输入中签率数值'};
  if(/^-/.test(s)) return {ok:false, error:'中签率必须为正数，不能为负值'};
  if(!/^\d+(\.\d+)?$/.test(s)) return {ok:false, error:'输入包含非法字符，请输入纯数字，例如 0.178925'};
  var parts = s.split('.');
  var intPart = parts[0];
  var decRaw = parts[1] || '';
  var decPart = decRaw.replace(/0+$/, '');
  if(decPart.length > 6) return {ok:false, error:'精度超出支持范围（最小到亿分之一，最多支持小数点后6位）'};
  var intVal = Number(intPart);
  if(intVal >= 100) return {ok:false, error:'中签率必须小于 100（%）'};
  if(intVal >= 1) return {ok:false, error:'当前仅支持小于 1% 的中签率（千分位至亿分位）'};
  var padded = (decPart + '000000').slice(0, 6);
  var digits = padded.split('').map(function(c){ return c.charCodeAt(0) - 48; });
  if(digits.every(function(d){ return d === 0; })) return {ok:false, error:'中签率必须大于 0'};
  return {
    ok:true,
    digits:digits,                          /* digits[0]→千分位 … digits[5]→亿分位 */
    normStr:'0.' + padded.replace(/0+$/, ''),
    scaled:Number(padded)                   /* 以 10^-6 % 为单位的整数值，用于合计校验 */
  };
}

/* 按数位拆解，生成环节计划 */
function buildPlan(digits){
  var steps = [];
  digits.forEach(function(d, i){
    if(d === 0) return;                     /* 数字为 0 的位直接跳过 */
    var N = i + 3;                          /* 千分位=3位 … 亿分位=8位 */
    var base = Math.pow(10, N);
    var step = {
      N:N,
      digit:d,
      frac:DENOM_NAMES[N] + '分之' + CN_DIGITS[d],
      percentStr:'0.' + '0'.repeat(i) + d   /* 该位贡献的中签率（%） */
    };
    var divisible = base % d === 0;         /* 拆分判断：10^N ÷ 分子 是否除得尽 */
    if(d === 1){
      step.type = 'A';
    }else if(divisible){
      step.type = 'B';
      step.interval = base / d;
    }else{
      step.type = 'C';
      var ab = SPLIT_MAP[d];
      step.parts = [
        {m:ab[0], interval:base / ab[0]},
        {m:ab[1], interval:ab[1] > 1 ? base / ab[1] : null}
      ];
    }
    steps.push(step);
  });
  return steps;
}

/* 合计校验：各环节贡献之和（10^-6 % 整数单位）应与输入一致 */
function scaledSum(steps){
  return steps.reduce(function(sum, st){
    return sum + st.digit * Math.pow(10, 8 - st.N);
  }, 0);
}

/* ============ 文案模板 ============ */

function partSentence(N, m, interval){
  if(m === 1) return '摇出一个' + N + '位数的中签号码。';
  return '摇出一个' + N + '位数作为基本中签号码，然后递增或递减' + interval +
         '（' + numToChinese(interval) + '），得到另外' + (m - 1) + '个中签号码。';
}

function buildSegments(steps){
  return steps.map(function(st, idx){
    var paras = [];
    if(st.type === 'A'){                                        /* 模板A：分子为1 */
      paras.push('下面我们摇出' + st.frac + '的中签号码，摇出一个' + st.N + '位数的中签号码。');
    }else if(st.type === 'B'){                                  /* 模板B：不拆分且分子>1 */
      paras.push('下面我们摇出' + st.frac + '的中签号码，' + partSentence(st.N, st.digit, st.interval));
    }else{                                                      /* 模板C：拆分 */
      var pa = st.parts[0], pb = st.parts[1];
      var fA = DENOM_NAMES[st.N] + '分之' + CN_DIGITS[pa.m];
      var fB = DENOM_NAMES[st.N] + '分之' + CN_DIGITS[pb.m];
      paras.push('下面我们摇出' + st.frac + '的中签号码。将' + st.frac + '拆分成' + fA + '和' + fB + '。');
      paras.push('首先我们摇出' + fA + '的中签号码，' + partSentence(st.N, pa.m, pa.interval));
      paras.push('下面我们摇出' + fB + '的中签号码，' + partSentence(st.N, pb.m, pb.interval));
    }
    paras.push('凡申购号码末' + st.N + '位数与以上产生的号码相同即中签。');
    return {title:(idx + 1) + '. ' + st.frac, paras:paras};
  });
}

function buildPlainText(normStr, segments){
  var lines = ['新股摇号抽签仪式主持稿', '（中签率：' + normStr + '%）', ''];
  segments.forEach(function(seg, i){
    if(i > 0){ lines.push('———————————————————————', ''); }
    lines.push(seg.title);
    seg.paras.forEach(function(p){ lines.push(p); });
    lines.push('');
  });
  return lines.join('\n');
}

/* ============ 页面渲染与交互 ============ */

if(typeof document !== 'undefined'){

  var input = document.getElementById('rateInput');
  var errorBox = document.getElementById('errorBox');
  var outputArea = document.getElementById('outputArea');
  var overviewTable = document.getElementById('overviewTable');
  var scriptDoc = document.getElementById('scriptDoc');
  var genBtn = document.getElementById('genBtn');
  var copyBtn = document.getElementById('copyBtn');
  var printBtn = document.getElementById('printBtn');
  var currentPlainText = '';

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function intervalCell(st){
    if(st.type === 'A') return '—';
    if(st.type === 'B') return String(st.interval);
    var b = st.parts[1];
    return st.parts[0].interval + (b.interval ? ' / ' + b.interval : ' / —');
  }

  function splitCell(st){
    if(st.type === 'C') return '是（' + st.parts[0].m + '+' + st.parts[1].m + '）';
    return '否';
  }

  function renderOverview(steps, normStr, sumOk){
    var html = '<thead><tr><th>环节</th><th>中签率</th><th>位数</th><th>号码个数</th><th>是否拆分</th><th>间隔</th></tr></thead><tbody>';
    steps.forEach(function(st, i){
      html += '<tr><td>' + (i + 1) + '</td><td>' + st.frac + '（' + st.percentStr + '%）</td><td>' + st.N +
              '</td><td>' + st.digit + '</td><td>' + splitCell(st) + '</td><td>' + intervalCell(st) + '</td></tr>';
    });
    var check = sumOk ? '<span class="ok">校验通过 ✓</span>' : '<span style="color:#dc2626">校验不符 ✗</span>';
    html += '<tr class="total"><td>合计</td><td>' + esc(normStr) + '%</td><td colspan="4">' + check + '</td></tr>';
    html += '</tbody>';
    overviewTable.innerHTML = html;
  }

  function renderDoc(normStr, segments){
    var html = '<div class="doc-head"><h2>新股摇号抽签仪式主持稿</h2>' +
               '<div class="rate-line">中签率：' + esc(normStr) + '%</div></div>';
    segments.forEach(function(seg, i){
      if(i > 0) html += '<hr class="divider">';
      html += '<div class="segment"><h3>' + esc(seg.title) + '</h3>';
      seg.paras.forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });
      html += '</div>';
    });
    scriptDoc.innerHTML = html;
  }

  function generate(){
    var res = parsePercent(input.value);
    if(!res.ok){
      errorBox.textContent = res.error;
      outputArea.style.display = 'none';
      return;
    }
    errorBox.textContent = '';
    var steps = buildPlan(res.digits);
    var segments = buildSegments(steps);
    currentPlainText = buildPlainText(res.normStr, segments);
    renderOverview(steps, res.normStr, scaledSum(steps) === res.scaled);
    renderDoc(res.normStr, segments);
    outputArea.style.display = '';
  }

  genBtn.addEventListener('click', generate);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') generate();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(chip){
    chip.addEventListener('click', function(){
      input.value = chip.getAttribute('data-v');
      generate();
    });
  });

  copyBtn.addEventListener('click', function(){
    if(!currentPlainText) return;
    function done(){
      copyBtn.textContent = '已复制 ✓';
      setTimeout(function(){ copyBtn.textContent = '一键复制全文'; }, 1500);
    }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = currentPlainText;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(currentPlainText).then(done, fallback);
    }else{
      fallback();
    }
  });

  printBtn.addEventListener('click', function(){ window.print(); });

  /* 页面加载后自动以默认示例生成一次 */
  generate();
}
</script>
</body>
</html>
